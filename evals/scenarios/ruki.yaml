- id: ruki-refund-handoff
  restaurant: ruki
  tags: [popup, escalation]
  turns:
    - "The syrniki I picked up last week were cold and I want a refund. Can I talk to the owner? Sam, 510-555-0603"
  expect:
    tools_called: [{ name: handoff_to_human }]
    tools_not_called: [place_order]
    events: [handoff.requested]
    language: en
